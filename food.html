
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Rawsh - خواردن و شیرینی">
  <title>خواردن و شیرینی | Rawsh</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #050505;
      --gold: #e9ad24;
      --gold-light: #ffdc78;
      --white: #fff;
      --muted: #c8c8c8;
      --border: rgba(220,164,42,.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, rgba(180,115,15,.13), transparent 55%),
        var(--black);
      color: var(--white);
      font-family: "Noto Sans Arabic", sans-serif;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    .header {
      height: 85px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,5,5,.95);
    }

    .header-inner {
      width: min(1200px, 92%);
      height: 100%;
      margin: auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      direction: ltr;
    }

    .brand {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
    }

    .brand img {
      width: 155px;
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 0 9px rgba(230,165,35,.2));
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 18px;
      border: 1px solid var(--gold);
      border-radius: 9px;
      color: var(--gold-light);
      font-size: 14px;
      font-weight: 700;
      transition: .3s;
      direction: rtl;
    }

    .back-button:hover {
      background: var(--gold);
      color: #050505;
    }

    /* MAIN */

    .main {
      flex: 1;
      width: min(1100px, 92%);
      margin: auto;
      padding: 75px 0;
      text-align: center;
    }

    .main-logo {
      width: 125px;
      height: 125px;
      object-fit: contain;
      margin-bottom: 25px;
      filter: drop-shadow(0 0 15px rgba(220,164,42,.22));
    }

    .gold-line {
      width: 180px;
      height: 2px;
      margin: 20px auto;
      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        #fff0b0,
        var(--gold),
        transparent
      );
      box-shadow: 0 0 12px rgba(255,190,55,.5);
    }

    h1 {
      color: var(--gold-light);
      font-size: clamp(27px, 4vw, 40px);
      font-weight: 900;
      margin-bottom: 15px;
    }

    .intro {
      max-width: 650px;
      margin: auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 2.2;
    }

    .coming {
      margin: 45px auto 0;
      padding: 25px;
      max-width: 520px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(145deg, #17120a, #080808);
      color: var(--gold-light);
      line-height: 2;
    }

    /* LANGUAGE SELECTOR */

    .language-area {
      padding: 25px 15px 30px;
      text-align: center;
      border-top: 1px solid var(--border);
      background: #030303;
    }

    .language-title {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .language-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .language-button {
      min-width: 105px;
      padding: 10px 17px;
      background: #101010;
      color: #ddd;
      border: 1px solid rgba(220,164,42,.35);
      border-radius: 9px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .25s;
    }

    .language-button:hover,
    .language-button.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #050505;
      box-shadow: 0 0 15px rgba(220,164,42,.2);
    }

    .footer {
      text-align: center;
      padding: 15px;
      color: #777;
      font-size: 12px;
      background: #030303;
    }

    .footer strong {
      color: var(--gold);
    }

    @media (max-width: 600px) {
      .header {
        height: 72px;
      }

      .brand img {
        width: 120px;
      }

      .back-button {
        padding: 8px 11px;
        font-size: 12px;
      }

      .main {
        padding: 55px 0;
      }

      .main-logo {
        width: 105px;
        height: 105px;
      }

      .intro {
        font-size: 14px;
      }

      .language-button {
        min-width: 90px;
        padding: 9px 12px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">

      <a class="back-button" href="index.html">
        <span>←</span>
        <span data-i18n="back">گەڕانەوە</span>
      </a>

      <a class="brand" href="index.html">
        <img
          src="file_000000008c388246a1a14bb325b59eb6(1).png"
          alt="Rawsh"
        >
      </a>

    </div>
  </header>

  <main class="main">

    <img
      class="main-logo"
      src="file_0000000090a081f4805def2e8128fe81.png"
      alt="Rawsh Logo"
    >

    <div class="gold-line"></div>

    <h1 data-i18n="title">خواردن و شیرینی</h1>

    <p class="intro" data-i18n="intro">
      بەخێربێیت بۆ بەشی خواردن و شیرینی.
      لەم بەشەدا دەتوانیت نموونەی وێبسایتێکی تایبەت بە
      چێشتخانە، کافێ، شیرینی فرۆشی و خواردن ببینیت.
    </p>

    <div class="coming" data-i18n="coming">
      بەشی خواردن و شیرینی بە زووترین کات ئامادە دەکرێت.
    </div>

  </main>

  <section class="language-area">

    <p class="language-title" data-i18n="language">
      زمانی پەڕەکە هەڵبژێرە
    </p>

    <div class="language-buttons">

      <button class="language-button active" type="button" data-lang="ku">
        کوردی
      </button>

      <button class="language-button" type="button" data-lang="en">
        English
      </button>

      <button class="language-button" type="button" data-lang="ar">
        العربية
      </button>

    </div>

  </section>

  <footer class="footer">
    <strong>Rawsh</strong> — <span data-i18n="rights">هەموو مافەکان پارێزراون.</span>
  </footer>

  <script>
    const translations = {
      ku: {
        back: "گەڕانەوە",
        title: "خواردن و شیرینی",
        intro: "بەخێربێیت بۆ بەشی خواردن و شیرینی. لەم بەشەدا دەتوانیت نموونەی وێبسایتێکی تایبەت بە چێشتخانە، کافێ، شیرینی فرۆشی و خواردن ببینیت.",
        coming: "بەشی خواردن و شیرینی بە زووترین کات ئامادە دەکرێت.",
        language: "زمانی پەڕەکە هەڵبژێرە",
        rights: "هەموو مافەکان پارێزراون."
      },

      en: {
        back: "Go Back",
        title: "Food & Sweets",
        intro: "Welcome to the Food & Sweets section. Here you can explore a website concept designed for restaurants, cafés, bakeries and food businesses.",
        coming: "The Food & Sweets section will be available soon.",
        language: "Choose your language",
        rights: "All rights reserved."
      },

      ar: {
        back: "العودة",
        title: "الأطعمة والحلويات",
        intro: "مرحباً بك في قسم الأطعمة والحلويات. يمكنك هنا استكشاف نموذج موقع إلكتروني مخصص للمطاعم والمقاهي ومحلات الحلويات والأطعمة.",
        coming: "سيكون قسم الأطعمة والحلويات متاحاً قريباً.",
        language: "اختر لغة الصفحة",
        rights: "جميع الحقوق محفوظة."
      }
    };

    const languageButtons = document.querySelectorAll(".language-button");

    function changeLanguage(lang) {
      const selected = translations[lang];

      if (!selected) return;

      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "en" ? "ltr" : "rtl";

      document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;
        element.textContent = selected[key];
      });

      languageButtons.forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.lang === lang
        );
      });

      document.title = selected.title + " | Rawsh";
    }

    languageButtons.forEach(button => {
      button.addEventListener("click", () => {
        changeLanguage(button.dataset.lang);
      });
    });
  </script>

</body>
</html>
