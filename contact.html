
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پەیوەندی | Rawsh</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: #fff;
      min-height: 100vh;
    }

    header {
      width: 100%;
      min-height: 90px;
      padding: 15px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      position: relative;
    }

    .header-logo {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .brand-logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 145px;
      max-height: 65px;
      object-fit: contain;
    }

    .back-link {
      color: #d4af37;
      text-decoration: none;
      font-size: 15px;
    }

    .contact-section {
      min-height: calc(100vh - 90px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
      text-align: center;
    }

    .contact-content {
      width: 100%;
      max-width: 600px;
    }

    .main-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin-bottom: 25px;
    }

    h1 {
      color: #d4af37;
      font-size: 34px;
      margin-bottom: 20px;
    }

    .description {
      color: #c7c7c7;
      font-size: 17px;
      line-height: 2;
      margin-bottom: 35px;
    }

    .phone {
      direction: ltr;
      display: block;
      color: #d4af37;
      font-size: 25px;
      font-weight: bold;
      text-decoration: none;
      margin-bottom: 30px;
    }

    .contact-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 330px;
      padding: 17px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: 0.3s;
    }

    .whatsapp {
      background: #d4af37;
      color: #080808;
      border: 1px solid #d4af37;
    }

    .whatsapp:hover {
      background: transparent;
      color: #d4af37;
    }

    .button-icon {
      font-size: 22px;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px 5%;
      }

      .brand-logo {
        width: 115px;
      }

      .header-logo {
        width: 45px;
        height: 45px;
      }

      h1 {
        font-size: 27px;
      }

      .description {
        font-size: 15px;
      }

      .main-logo {
        width: 125px;
        height: 125px;
      }
    }
  </style>
</head>

<body>

  <header>
    <img
      class="header-logo"
      src="file_0000000090a081f4805def2e8128fe81.png"
      alt="Rawsh R Logo"
    >

    <img
      class="brand-logo"
      src="file_000000008c388246a1a14bb325b59eb6(1).png"
      alt="Rawsh"
    >

    <a class="back-link" href="index.html">گەڕانەوە</a>
  </header>

  <main class="contact-section">
    <div class="contact-content">

      <img
        class="main-logo"
        src="file_0000000090a081f4805def2e8128fe81.png"
        alt="Rawsh Logo"
      >

      <h1>پەیوەندی بە Rawsh</h1>

      <p class="description">
        بۆ داواکاری و زانیاری زیاتر، دەتوانیت لە ڕێگەی واتساپەوە پەیوەندیمان پێوە بکەیت.
      </p>

      <a class="phone" href="tel:+9647771503474">
        0777 150 34 74
      </a>

      <a
        class="contact-button whatsapp"
        href="https://wa.me/9647771503474"
        target="_blank"
        rel="noopener"
      >
        <span class="button-icon">◉</span>
        پەیوەندی لە واتساپ
      </a>

    </div>
  </main>

</body>
</html>
